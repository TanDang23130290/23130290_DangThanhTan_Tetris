<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
    background-color: #0f1026;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    }
    /*tạo viền*/
    .game-container {
    width: 400px;
    height: 600px;
    background: #1a1c38;
    border: 4px solid #4e54c8;
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(78, 84, 200, 0.4);
    position: relative;
    overflow: hidden;
    }
    /* Đổi màn hình */
    .screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease-in-out;
    }

    .screen.active, .screen.screen-active {
    opacity: 1;
    pointer-events: all;
    }
    .game-title {
    font-size: 3.2rem;
    font-weight: 900;
    letter-spacing: 6px;
    color: #00f0ff;
    text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
    margin-bottom: 50px;
    }
    /* thiết kế nút */

    .btn-primary, .btn-secondary, .btn-setting-button, .btn-back {
    padding: 14px 20px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    }
    .btn-primary {
    background: linear-gradient(135deg, #ff007f, #7928ca);
    color: white;
    box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
    }

    .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
    }

    .btn-secondary, .btn-setting-button {
    background: #2a2d5c;
    color: #a0a5e8;
    border: 1px solid #4e54c8;
    }

    .btn-secondary:hover, .btn-setting-button:hover {
    background: #383c7a;
    color: white;
    }

    .btn-back {
    margin-top: 30px;
    background: transparent;
    color: #8a8dcd;
    border: 1px solid #8a8dcd;
    font-size: 0.9rem;
    }

    .btn-back:hover {
    background: rgba(138, 141, 205, 0.1);
    color: white;
    }
    /* 2. UI Stage */
    .Menu-title, .screen-title {
    font-size: 1.6rem;
    color: #ffdd00;
    margin-bottom: 30px;
    text-shadow: 0 0 8px rgba(255, 221, 0, 0.5);
    }
    .stage-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    width: 100%;
    }

    .game-screen{
    position:relative;
    }
    .btn-close {
    position: absolute;
    top: 10px;
    right: 15px;
    background: transparent;
    border: none;
    color: #8a8dcd;
    font-size: 1.8rem;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
    line-height: 1;
    transition: all 0.2s ease;
    }

    .btn-close:hover {
    color: #ff007f;
    transform: scale(1.2);
    }

    /* Bổ sung style cơ bản cho layout chơi game để thu nhỏ vừa khung */
    .play-layout {
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(0.75);
    }

    .toolbox {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
    margin-top: 5px;
    }

    .toolbox .item {
    height: 28px;
    background: #252850;
    border: 1px solid #4e54c8;
    color: #ff007f;
    border-radius: 4px;
    cursor: pointer;
    }
    /* 3. Main game UI*/
    .play-playout{
    display:flex;
    flex-direction: row;
    gap: 15px;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    }
    /*Khung xếp hình */
    .game-board-container {
    background-color: #050614;
    border: 3px solid #00f0ff;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    }
    #tetris-canvas {
    display: block;
    background-color: #08091a;
    }

    /* Bảng thông tin */
    .sidebar-gamebox {
    width: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 480px; /* Bằng chiều cao của canvas xếp hình */
    background: #14162e;
    border: 2px solid #3d428b;
    border-radius: 8px;
    padding: 10px 8px;
    }
    /*Tiêu đề màn chơi*/
    .title-box{
    font-size: 1.5rem;
    font-weight: 900;
    color: #ffdd00;
    text-shadow: 0 0 8px rgba(255, 221, 0, 0.6);
    }
    /* Ô điểm*/
    .score-box {
    font-size: 0.85rem;
    color: #ffffff;
    text-align: center;
    background: #1e2145;
    width: 100%;
    padding: 6px 4px;
    border-radius: 6px;
    border: 1px solid #3d428b;
    }
    .score-label {
    display: block;
    color: #a0a5e8;
    font-size: 0.75rem;
    }
    #score-value {
    font-weight: bold;
    color: #00f0ff;
    }
    .next-piece-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    background: #1e2145;
    border: 1px solid #3d428b;
    border-radius: 6px;
    padding: 6px 0;
    }
    .box-label {
    font-size: 0.7rem;
    color: #a0a5e8;
    margin-bottom: 4px;
    }

    #next-canvas {
    background-color: #08091a;
    border: 1px solid #2a2d5c;
    border-radius: 4px;
    }
    /* Thanh công cụ */
    .toolbox {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
    }

    .item {
    width: 100%;
    aspect-ratio: 1;
    background: #252850;
    border: 1px solid #4e54c8;
    border-radius: 6px;
    color: #ff007f;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s ease;
    }
    .tool-count {
        position: absolute;
        bottom: 2px;
        right: 4px;
        font-size: 0.65rem;
        color: #ffdd00;
        font-weight: bold;
    }

    .item:hover {
    background: #4e54c8;
    color: #ffffff;
    box-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
    }
    /* nút X */
    #btn-close-button {
    padding: 6px 10px;
    font-size: 0.75rem;
    width: 100%;
    margin-top: 0;
    }
    /* Nút Tạm dừng (Pause) */
    .btn-pause {
        position: absolute;
        top: 10px;
        right: 55px;
        background: transparent;
        border: none;
        color: #8a8dcd;
        font-size: 1.4rem;
        font-weight: bold;
        cursor: pointer;
        z-index: 10;
        line-height: 1;
        transition: all 0.2s ease;
    }

    .btn-pause:hover {
        color: #00f0ff;
        transform: scale(1.2);
    }

    /* Tiêu đề & Điểm số trong Game Over */
    .gameover-title {
        color: #ff007f;
        font-size: 2.8rem;
        margin-bottom: 20px;
        text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
    }

    .final-score-text {
        font-size: 1.2rem;
        color: #a0a5e8;
        margin-bottom: 30px;
    }

    .final-score-number {
        color: #00f0ff;
        font-weight: bold;
    }
</style>
<body>

<div class="game-container">
    <!-- MainUI -->
    <div id="main-menu" class="screen screen-active">
        <h1 class="game-title">Tetris</h1>
        <section class="menu-button">
            <button id="btn-play-button" class="btn-primary">Chơi</button>
            <button class="btn-setting-button btn-secondary">Cài đặt</button>
        </section>
    </div>

    <!-- Màn hình chọn ải -->
    <div id="select-menu" class="screen">
        <h1 class="Menu-title">Chọn màn chơi</h1>
        <section class="Stage-choose">
            <!-- Màn 1 -->
            <button class="Stage1" data-stage="1">
                <span class="Stage-title">Màn 1</span>
            </button>
        </section>
        <button id="btn-back-to-menu" class="btn-back">Quay lại</button>
    </div>

    <!-- Màn hình chơi game -->
    <div id="play-menu" class="screen">
        <!-- Nút thoát -->
        <button id="btn-close-button" class="btn-close">X</button>
        <button id="btn-pause-button" class="btn-pause" style="position: absolute; top: 10px; right: 55px; background: transparent; border: none; color: #8a8dcd; font-size: 1.4rem; font-weight: bold; cursor: pointer; z-index: 10;">⏸</button>
        <div class="play-layout">
            <!-- Thêm canvas bàn chơi bên trái để khớp với giao diện  -->
            <div class="game-board-container" style="display:inline-block; vertical-align:top;">
                <canvas id="tetris-canvas" width="240" height="480"></canvas>
            </div>

            <div class="sidebar-gamebox" style="display:inline-block; vertical-align:top; margin-left: 8px;">
                <!-- Tiêu đề màn chơi -->
                <div class="title-box">
                    <h1 class="stage-title" style="color: #ffdd00; font-size: 1.3rem;">1-1</h1>
                </div>

                <!-- Bảng diểm-->
                <div class="score-box">
                    <span class="score" style="font-size: 0.75rem; color: #a0a5e8;">Điểm:</span>
                    <span id="score-value" style="color: #00f0ff; font-weight: bold;">0000</span>
                </div>

                <!-- Ô dự báo-->
                <div class="next-piece-box">
                    <canvas id="next-canvas" width="90" height="90" style="background: #08091a; border-radius: 4px;"></canvas>
                </div>

                <!-- toolbar-->
                <div class="toolbox">
                    <button class="item" id="tool-pickaxe" title="Cuốc chim: Click chọn vị trí để phá 2 hàng dọc (Không tính điểm)">♦ <span class="tool-count">3</span></button>
                    <button class="item" id="tool-bomb" title="Bom: Click chọn vị trí để phá 2 hàng ngang (Không tính điểm)">⬡ <span class="tool-count">3</span></button>
                    <button class="item" id="tool-clock" title="Đồng hồ: Tăng 30% tốc độ rơi, thưởng điểm tăng thêm 30%">★ <span class="tool-count">3</span></button>
                    <button class="item" id="tool-dumbbell" title="Quả tạ: Kéo tất cả các khối lơ lửng rơi xuống đáy/chạm vật cản">✡ <span class="tool-count">3</span></button>
                </div>
            </div>
        </div>
    </div>
    <div id="gameover-menu" class="screen">
        <button id="btn-restart" class="btn-primary">Chơi lại</button>
        <button id="btn-back-to-select" class="btn-back">Chọn màn</button>
        <h1 class="game-title" style="color: #ff007f; font-size: 2.5rem; margin-bottom: 20px;">Game Over</h1>
        <p style="font-size: 1.2rem; color: #a0a5e8; margin-bottom: 30px;">Điểm của bạn: <span id="final-score" style="color: #00f0ff; font-weight: bold;">0</span></p>
    </div>
</div>


<script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>
<body>

<div class="game-container">
    <!-- MainUI -->
    <div id="main-menu" class="screen-active">
        <h1 class="game-title">Tetris</h1>
        <section class="menu-button">
            <button class="btn-play-button" class="button-primary">Chơi</button>
            <button class="btn-setting-button" class="button-secondary">Cài đặt</button>
        </section>
    </div>
    //*Màn hình chọn màn chơi
    <div id="select-menu" class="screen">
        <h1 class="Menu-title">Chọn màn chơi</h1>
        <section class="Stage-choose">
            //Màn 1
            <button class="Stage1" data-stage="1">
                <span class="Stage-title" Màn 1></span>
            </button>
        </section>
    </div>


    //*Màn hình chơi game
    <div id="play-menu" class="screen">
        <button id="btn-close-button" class="btn-close" X></button>

        <div class="play-layout">
            <div class="sidebar-gamebox">
 //* Tiêu đề màn chơi
                <div class ="title-box">
                <h1 class="stage-title">1-1 </h1>
                </div>

 //* Bảng diểm
                <div class="score-box">
                    <span class="score"></span>
                    <span id="score-value"></span>
                </div>

  //* Ô dự báo
                <div class="next-piece-box">
                    <canvas id="next-canvas" width ="90" height="90"></canvas>
                </div>
   //* toolbar

                <div class ="toolbox">
                    <button class="item"></button>
                    <button class="item"></button>
                    <button class="item"></button>
                    <button class="item"></button>
                    <button class="item"></button>

                </div>

            </div>
        </div>

    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    <!-- MainUI -->
    <div id="main-menu" class="screen screen-active">
        <h1 class="game-title">Tetris</h1>
        <section class="menu-button">
            <button id="btn-play-button" class="btn-primary">Chơi</button>
            <button class="btn-setting-button btn-secondary">Cài đặt</button>
        </section>
    </div>

    <!-- Màn hình chọn ải -->
    <div id="select-menu" class="screen">
        <h1 class="Menu-title">Chọn màn chơi</h1>
        <section class="Stage-choose">
            <!-- Màn 1 -->
            <button class="Stage1" data-stage="1">
                <span class="Stage-title">Màn 1</span>
            </button>
        </section>
        <button id="btn-back-to-menu" class="btn-back">Quay lại</button>
    </div>

    <!-- Màn hình chơi game -->
    <div id="play-menu" class="screen">
        <!-- Nút thoát -->
        <button id="btn-close-button" class="btn-close">X</button>
        <button id="btn-pause-button" class="btn-pause" style="position: absolute; top: 10px; right: 55px; background: transparent; border: none; color: #8a8dcd; font-size: 1.4rem; font-weight: bold; cursor: pointer; z-index: 10;">⏸</button>
        <div class="play-layout">
            <!-- Thêm canvas bàn chơi bên trái để khớp với giao diện  -->
            <div class="game-board-container" style="display:inline-block; vertical-align:top;">
                <canvas id="tetris-canvas" width="240" height="480"></canvas>
            </div>

            <div class="sidebar-gamebox" style="display:inline-block; vertical-align:top; margin-left: 8px;">
                <!-- Tiêu đề màn chơi -->
                <div class="title-box">
                    <h1 class="stage-title" style="color: #ffdd00; font-size: 1.3rem;">1-1</h1>
                </div>

                <!-- Bảng diểm-->
                <div class="score-box">
                    <span class="score" style="font-size: 0.75rem; color: #a0a5e8;">Điểm:</span>
                    <span id="score-value" style="color: #00f0ff; font-weight: bold;">0000</span>
                </div>

                <!-- Ô dự báo-->
                <div class="next-piece-box">
                    <canvas id="next-canvas" width="90" height="90" style="background: #08091a; border-radius: 4px;"></canvas>
                </div>

                <!-- toolbar-->
                <div class="toolbox">
                    <button class="item">♦</button>
                    <button class="item">⬡</button>
                    <button class="item">★</button>
                    <button class="item">✡</button>
                </div>
            </div>
        </div>
    </div>
    <div id="gameover-menu" class="screen">
        <button id="btn-restart" class="btn-primary">Chơi lại</button>
        <button id="btn-back-to-select" class="btn-back">Chọn màn</button>
    </div>
</div>
//

<script src="main.js"></script>
</body>
</html>
